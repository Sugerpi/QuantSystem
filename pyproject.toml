[project]
name = "quantcore"
version = "0.1.0"
description = "美股 ETF 橫斷面動量 + GARCH/DCC 波動率配置的量化研究系統"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "user" }]

# Phase 0 只需能載入/驗證 config。資料層、模型層等重依賴（pandas、arch、
# exchange_calendars、streamlit…）在其對應 Phase 才加入，保持骨架安裝輕量。
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantcore"]

# --- 工具設定（單一來源，避免散落多檔） ---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes、I isort、UP pyupgrade、B bugbear、SIM simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
