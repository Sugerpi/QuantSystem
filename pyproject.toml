[project]
name = "quantcore"
version = "0.1.0"
description = "美股 ETF 橫斷面動量 + GARCH/DCC 波動率配置的量化研究系統"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "user" }]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "exchange-calendars>=4.5",
    "pandas-datareader>=0.10",
    "python-dotenv>=1.0",
    "arch>=7.0",
    "plotly>=6.9.0",
    "scipy>=1.17.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantcore"]

# --- 工具設定（單一來源，避免散落多檔） ---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes、I isort、UP pyupgrade、B bugbear、SIM simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
markers = [
    "requires_snapshot: 需要 snapshots/ 下的真實快照；CI 無快照（gitignore）故自動 skip",
]
