<header class="controls">
  <form method="get" class="control-form">
    <label class="ctl">RUN
      <select name="run" onchange="this.form.submit()">
        {% for r in ctrl.available_runs %}
        <option value="{{ r }}" {% if r == ctrl.run %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </label>
    {% if ctrl.available_strategies %}
    <label class="ctl">策略
      <select name="focus" onchange="this.form.submit()">
        {% for s in ctrl.available_strategies %}
        <option value="{{ s }}" {% if s == ctrl.focus %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
  </form>
  <span class="spacer"></span>
  <span class="ident">{{ ctrl.run or "—" }}</span>
</header>
